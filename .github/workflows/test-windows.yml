# Runs the unit tests on Windows on every push and pull request, so that the
# C++ of the Boost.SML template (fsm-cli's sml.jinja) is compiled with MSVC, the
# compiler of FSM Editor for Visual Studio's users, then the smoke test in
# desktop VS Code. The release workflow tests on Linux with GCC.
name: Test on Windows

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Puts MSVC's cl on the PATH, which the tests pick first on Windows: runs
      # vcvars64.bat and passes the variables it changes on to the next steps.
      - name: Set up MSVC
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "No Visual Studio with the C++ tools found." }
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$' -and [Environment]::GetEnvironmentVariable($Matches[1]) -ne $Matches[2]) {
              "$($Matches[1])=$($Matches[2])" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
            }
          }

      - run: npm ci

      # fsm-editor-common's WebAssembly module, templates, schemas and interface cases, from the release pinned in
      # release.yml.
      - name: Fetch fsm-editor-common
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(sed -n 's/^ *FSM_COMMON_VERSION: *//p' .github/workflows/release.yml | tr -d '\r')
          gh release download "v$v" -R vincedupuis/fsm-editor-common -p "fsm-editor-common-$v.wasm" -p "fsm-editor-common-*-$v.tar.gz" -D common
          mv "common/fsm-editor-common-$v.wasm" common/common.wasm
          for part in templates schemas api-cases; do
            tar xzf "common/fsm-editor-common-$part-$v.tar.gz" -C common
            rm "common/fsm-editor-common-$part-$v.tar.gz"
          done
          ls -R common

      - name: Test
        run: npm run test:unit

      # The smoke test in desktop VS Code (the latest stable, downloaded by @vscode/test-electron).
      - name: Test in desktop VS Code
        run: npm run test:desktop
