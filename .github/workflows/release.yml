# On a version tag (v0.3.1), builds the VSIX, attaches it to the GitHub Release
# of that tag, and publishes it to the Visual Studio Marketplace when the
# VSCE_PAT secret is set (an Azure DevOps token with the Marketplace > Manage
# scope). The VSIX bundles fsm-editor-common's WebAssembly module (reading,
# writing, converting, validating, comparing and merging machines, and code
# generation) with fsm-cli's templates, on desktop and on the web.
name: Release

on:
  push:
    tags: ['v*']

env:
  # Release of fsm-editor-common (github.com/vincedupuis/fsm-editor-common) whose
  # fsm-editor-common-<version>.wasm and -templates, -schemas archives the VSIX bundles, and whose
  # -api-cases archive the tests replay. test-windows.yml reads it from here.
  FSM_COMMON_VERSION: 0.1.3

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the package version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match the package version $version" >&2
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fetch fsm-editor-common
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$FSM_COMMON_VERSION
          gh release download "v$v" -R vincedupuis/fsm-editor-common -p "fsm-editor-common-$v.wasm" -p "fsm-editor-common-*-$v.tar.gz" -D common
          mv "common/fsm-editor-common-$v.wasm" common/common.wasm
          for part in templates schemas api-cases; do
            tar xzf "common/fsm-editor-common-$part-$v.tar.gz" -C common
            rm "common/fsm-editor-common-$part-$v.tar.gz"
          done
          ls -R common

      - name: Test
        run: npm run test:unit

      - name: Build the VSIX
        # npm run package: vsce package --no-dependencies (the extension has no runtime dependencies, so the files
        # don't come from npm list).
        run: npm run package -- -o "$RUNNER_TEMP/fsm-editor-${GITHUB_REF_NAME#v}.vsix"

      - name: Attach the VSIX to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP"/*.vsix --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/*.vsix --title "FSM Editor $version" --generate-notes
          fi

      - name: Publish to the Visual Studio Marketplace
        if: env.VSCE_PAT != ''
        run: npx @vscode/vsce publish --packagePath "$RUNNER_TEMP/fsm-editor-${GITHUB_REF_NAME#v}.vsix"
