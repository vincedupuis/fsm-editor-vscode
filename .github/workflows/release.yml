# On a version tag (v0.3.1), builds the VSIX and the standalone `fsm` code
# generators, attaches them to the GitHub Release of that tag, and publishes the
# VSIX to the Visual Studio Marketplace when the VSCE_PAT secret is set (an Azure
# DevOps token with the Marketplace > Manage scope). FSM Editor for Visual Studio
# and for JetBrains IDEs download their `fsm` from these releases. The VSIX
# bundles fsm-generator, which runs the Jinja templates on desktop.
name: Release

on:
  push:
    tags: ['v*']

env:
  # Release of fsm-generator (github.com/vincedupuis/fsm-generator) the VSIX bundles.
  FSM_GENERATOR_VERSION: 0.1.0

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the package version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match the package version $version" >&2
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: oven-sh/setup-bun@v2

      - run: npm ci

      - name: Fetch fsm-generator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v$FSM_GENERATOR_VERSION" -R vincedupuis/fsm-generator -p "fsm-generator-$FSM_GENERATOR_VERSION-*" -D "$RUNNER_TEMP/generator"
          for archive in "$RUNNER_TEMP"/generator/*; do
            case "$archive" in
              *.zip) unzip -q "$archive" -d "$RUNNER_TEMP/generator" ;;
              *.tar.gz) tar xzf "$archive" -C "$RUNNER_TEMP/generator" ;;
            esac
          done
          for dir in "$RUNNER_TEMP"/generator/fsm-generator-$FSM_GENERATOR_VERSION-*/; do
            platform=$(basename "$dir" | sed "s/^fsm-generator-$FSM_GENERATOR_VERSION-//")
            mkdir -p generator
            cp -R "$dir" "generator/$platform"
          done
          ls generator

      - name: Test
        run: npm run test:unit

      - name: Build the VSIX
        run: npx @vscode/vsce package -o "$RUNNER_TEMP/fsm-editor-${GITHUB_REF_NAME#v}.vsix"

      - name: Build the fsm code generators
        run: |
          npm run build:bin
          version=${GITHUB_REF_NAME#v}
          cd dist
          for dir in fsm-$version-*; do
            case "$dir" in
              *-windows-*) zip -qr "$RUNNER_TEMP/$dir.zip" "$dir" ;;
              *) tar czf "$RUNNER_TEMP/$dir.tar.gz" "$dir" ;;
            esac
          done

      - name: Attach the VSIX and the generators to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          assets=("$RUNNER_TEMP"/*.vsix "$RUNNER_TEMP"/fsm-$version-*.tar.gz "$RUNNER_TEMP"/fsm-$version-*.zip)
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --title "FSM Editor $version" --generate-notes
          fi

      - name: Publish to the Visual Studio Marketplace
        if: env.VSCE_PAT != ''
        run: npx @vscode/vsce publish --packagePath "$RUNNER_TEMP/fsm-editor-${GITHUB_REF_NAME#v}.vsix"
