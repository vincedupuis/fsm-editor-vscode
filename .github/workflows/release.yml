# On a version tag (v0.3.1), builds the VSIX, attaches it to the GitHub Release
# of that tag, and publishes it to the Visual Studio Marketplace when the
# VSCE_PAT secret is set (an Azure DevOps token with the Marketplace > Manage
# scope). The VSIX bundles fsm-cli's WebAssembly module and templates, which
# generate the code on desktop and on the web.
name: Release

on:
  push:
    tags: ['v*']

env:
  # Release of fsm-cli (github.com/vincedupuis/fsm-cli) whose fsm-<version>.wasm,
  # fsm-templates-<version>.tar.gz and fsm-schemas-<version>.tar.gz the VSIX bundles, and whose
  # fsm-cases-<version>.tar.gz the tests use. test-windows.yml reads it from here.
  FSM_CLI_VERSION: 0.6.3

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the package version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match the package version $version" >&2
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fetch fsm-cli
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v$FSM_CLI_VERSION" -R vincedupuis/fsm-cli -p "fsm-$FSM_CLI_VERSION.wasm" -p "fsm-*-$FSM_CLI_VERSION.tar.gz" -D fsm
          mv "fsm/fsm-$FSM_CLI_VERSION.wasm" fsm/fsm.wasm
          for part in templates schemas cases; do
            tar xzf "fsm/fsm-$part-$FSM_CLI_VERSION.tar.gz" -C fsm
            rm "fsm/fsm-$part-$FSM_CLI_VERSION.tar.gz"
          done
          ls -R fsm

      - name: Test
        run: npm run test:unit

      - name: Build the VSIX
        # npm run package: vsce package --no-dependencies (the extension has no runtime dependencies, so the files
        # don't come from npm list).
        run: npm run package -- -o "$RUNNER_TEMP/fsm-editor-${GITHUB_REF_NAME#v}.vsix"

      - name: Attach the VSIX to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP"/*.vsix --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/*.vsix --title "FSM Editor $version" --generate-notes
          fi

      - name: Publish to the Visual Studio Marketplace
        if: env.VSCE_PAT != ''
        run: npx @vscode/vsce publish --packagePath "$RUNNER_TEMP/fsm-editor-${GITHUB_REF_NAME#v}.vsix"
